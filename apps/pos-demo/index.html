<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Maknoon POS</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="app">
    <header class="topbar">
      <div class="brand">
        <span class="brand-mark">◈</span>
        <span class="brand-name">Maknoon POS</span>
        <span class="badge badge-beta">Beta</span>
      </div>
      <div class="badges">
        <button id="netChip" class="net-chip">Network</button>
        <button id="receiptsBtn" class="icon-btn" aria-label="Receipts">🧾</button>
        <button id="settingsBtn" class="icon-btn" aria-label="Settings">⚙</button>
      </div>
    </header>

    <section class="amount-panel">
      <div class="amount-label" id="amountLabel">Amount</div>
      <div class="amount-display"><span class="unit" id="unit">$</span><span id="amount">0.00</span></div>
      <button id="flipBtn" class="flip-btn">⇄ <span id="equivalent">enter an amount</span></button>
    </section>

    <section class="keypad" id="keypad">
      <button class="key" data-k="1">1</button>
      <button class="key" data-k="2">2</button>
      <button class="key" data-k="3">3</button>
      <button class="key" data-k="4">4</button>
      <button class="key" data-k="5">5</button>
      <button class="key" data-k="6">6</button>
      <button class="key" data-k="7">7</button>
      <button class="key" data-k="8">8</button>
      <button class="key" data-k="9">9</button>
      <button class="key" data-k=".">.</button>
      <button class="key" data-k="0">0</button>
      <button class="key key-del" data-k="del">⌫</button>
    </section>

    <button id="chargeBtn" class="charge-btn" disabled>Charge customer</button>

    <!-- charge flow / result overlay -->
    <div id="overlay" class="overlay hidden">
      <div class="sheet">
        <div class="steps">
          <div class="step" data-step="verify">
            <span class="step-dot"></span>
            <div class="step-body">
              <div class="step-title">Verify customer</div>
              <div class="step-detail" id="verifyDetail">Identity check</div>
            </div>
            <span class="step-state" data-state="verify">…</span>
          </div>
          <div class="step" data-step="pay">
            <span class="step-dot"></span>
            <div class="step-body">
              <div class="step-title">Take payment</div>
              <div class="step-detail" id="payDetail">On-chain transfer</div>
            </div>
            <span class="step-state" data-state="pay">…</span>
          </div>
        </div>
        <div id="resultBox" class="result-box hidden"></div>
        <div class="sheet-actions">
          <button id="closeOverlay" class="ghost-btn">Close</button>
        </div>
      </div>
    </div>

    <!-- settings overlay -->
    <div id="settingsOverlay" class="overlay hidden">
      <div class="sheet scroll">
        <h2 class="sheet-title">Settings</h2>

        <label class="field">
          <span>Network</span>
          <select id="networkSelect"></select>
        </label>

        <label class="field">
          <span>Receive to</span>
          <select id="addressSelect"></select>
        </label>
        <p class="hint" id="addressHint">Pick one of your wallets or saved addresses.</p>

        <div class="field">
          <span>Verify from customer</span>
          <div class="seg">
            <button class="seg-btn" data-capture="sanctions">Sanctions check</button>
            <button class="seg-btn" data-capture="passport">Passport identity</button>
          </div>
        </div>
        <div id="passportAttrs" class="attrs hidden">
          <label class="chk"><input type="checkbox" value="givenName" checked /> Given name</label>
          <label class="chk"><input type="checkbox" value="familyName" checked /> Family name</label>
          <label class="chk"><input type="checkbox" value="nationality" checked /> Nationality</label>
          <label class="chk"><input type="checkbox" value="dateOfBirth" /> Date of birth</label>
        </div>

        <div class="sheet-actions">
          <button id="saveSettings" class="charge-btn compact">Done</button>
        </div>
      </div>
    </div>

    <!-- receipts overlay -->
    <div id="receiptsOverlay" class="overlay hidden">
      <div class="sheet scroll">
        <h2 class="sheet-title">Receipts</h2>
        <div id="txList" class="tx-list"></div>
        <div class="sheet-actions">
          <button id="closeReceipts" class="ghost-btn">Close</button>
        </div>
      </div>
    </div>
  </main>
  <script src="app.js"></script>
</body>
</html>
